<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>街道聽音尋車記</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0b1329; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; }
    #game-container {
      position: relative; width: 100vw; height: 100vh; max-height: 56.25vw; max-width: 177.78vh;
      margin: auto; top: 50%; transform: translateY(-50%); background: #87ceeb; border: 4px solid #fff;
      border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 45px rgba(0,0,0,0.7);
    }
    #header-bar {
      height: 14%; background: rgba(255, 255, 255, 0.98); border-bottom: 4px solid #f59e0b;
      display: flex; align-items: center; justify-content: space-between; padding: 0 24px; z-index: 100;
    }
    .level-badge {
      font-size: 24px; font-weight: 900; color: #7c2d12; background: #fed7aa;
      padding: 6px 18px; border-radius: 30px; border: 3px solid #ea580c; white-space: nowrap;
    }
    .instruction-text { font-size: 26px; font-weight: 900; color: #b91c1c; text-align: center; flex: 1; margin: 0 12px; }
    .btn-replay-sound {
      background: #10b981; color: #ffffff; font-size: 22px; font-weight: bold;
      border: 3px solid #047857; border-radius: 40px; padding: 8px 24px; cursor: pointer;
      box-shadow: 0 4px 0 #047857; white-space: nowrap;
    }
    .btn-replay-sound:active { transform: translateY(3px); box-shadow: none; }
    #stage-area { flex: 1; position: relative; overflow: hidden; background: linear-gradient(to bottom, #60a5fa 0%, #93c5fd 40%, #dbeafe 55%); }
    .iso-street-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
    #grandpa-box {
      position: absolute; bottom: 15%; left: 4%; width: 120px; height: 200px; z-index: 20;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end; pointer-events: none;
    }
    .grandpa-shadow { position: absolute; bottom: -6px; width: 85px; height: 22px; background: rgba(0, 0, 0, 0.4); border-radius: 50%; filter: blur(4px); z-index: -1; }
    .listen-badge { display: flex; align-items: center; gap: 4px; animation: pulse 0.9s infinite alternate; margin-bottom: -15px; z-index: 30; }
    .listen-ear { font-size: 42px; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5)); }
    .listen-q { font-size: 44px; font-weight: 900; color: #ef4444; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5)); animation: bounce 0.8s infinite alternate; }
    @keyframes pulse { 0% { transform: scale(0.9); } 100% { transform: scale(1.15); } }
    @keyframes bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-8px); } }
    .grandpa-svg { width: 100%; height: 90%; filter: drop-shadow(0 8px 12px rgba(0,0,0,0.4)); animation: idleBreathe 2.2s ease-in-out infinite alternate; }
    @keyframes idleBreathe { 0% { transform: translateY(0); } 100% { transform: translateY(-5px); } }
    #vehicles-container {
      position: absolute; bottom: 8%; left: 20%; right: 3%; height: 165px;
      display: flex; align-items: center; justify-content: space-evenly; gap: 16px; z-index: 25;
    }
    .vehicle-item {
      flex: 1; max-width: 180px; height: 148px; cursor: pointer; display: flex; flex-direction: column;
      align-items: center; justify-content: center; border-radius: 22px; background: linear-gradient(145deg, #ffffff, #f1f5f9);
      border: 4px solid #ffffff; box-shadow: 0 16px 28px rgba(0,0,0,0.4), 0 5px 0 #94a3b8; transition: all 0.25s ease;
    }
    .vehicle-emoji { font-size: 68px; line-height: 1; filter: drop-shadow(0 6px 8px rgba(0,0,0,0.25)); }
    .vehicle-name-tag { background: #0f172a; color: #fff; font-size: 21px; font-weight: 900; padding: 4px 16px; border-radius: 12px; margin-top: 6px; box-shadow: 0 3px 6px rgba(0,0,0,0.3); }
    .locked-controls { pointer-events: none !important; opacity: 0.45 !important; filter: grayscale(40%); }
    .vehicle-item:not(.locked-controls):hover { transform: translateY(-8px) scale(1.05); box-shadow: 0 22px 35px rgba(0,0,0,0.5), 0 8px 0 #64748b; }
    .vehicle-item:not(.locked-controls):active { transform: translateY(2px) scale(0.98); }
    #guess-panel {
      position: absolute; bottom: 8%; left: 20%; right: 4%; height: 60%; background: rgba(255, 255, 255, 0.98);
      border-radius: 26px; border: 5px solid #0284c7; box-shadow: 0 18px 40px rgba(0,0,0,0.45);
      display: none; align-items: center; justify-content: space-around; padding: 16px; z-index: 40;
    }
    .guess-btn {
      flex: 1; height: 90%; margin: 0 12px; background: #f0fdf4; border: 4px solid #22c55e;
      border-radius: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; box-shadow: 0 8px 0 #15803d, 0 12px 20px rgba(0,0,0,0.25); transition: all 0.25s ease;
    }
    .guess-btn:not(.locked-controls):active { transform: translateY(5px); box-shadow: 0 3px 0 #15803d; }
    .guess-btn .vehicle-emoji { font-size: 74px; }
    .guess-btn span { font-size: 27px; font-weight: 900; color: #14532d; margin-top: 8px; }
    .shake-error { animation: shake 0.4s ease-in-out; border-color: #ea580c !important; background: #ffedd5 !important; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-14px); } 75% { transform: translateX(14px); } }
    .correct-glow { box-shadow: 0 0 45px #10b981 !important; border-color: #10b981 !important; transform: scale(1.1) !important; }
    #start-modal {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.94);
      display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 300;
    }
    .btn-start-game {
      background: #f59e0b; color: #7c2d12; font-size: 38px; font-weight: 900; border: 5px solid #fff;
      border-radius: 50px; padding: 18px 60px; cursor: pointer; box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }
    .btn-start-game:active { transform: scale(0.96); }
    #result-modal {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.95);
      display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 250; color: #fff;
    }
    .result-card {
      background: #fff; color: #1e293b; padding: 34px 54px; border-radius: 28px;
      text-align: center; box-shadow: 0 20px 45px rgba(0,0,0,0.6); border: 6px solid #fbbf24;
    }
    .result-card h2 { font-size: 42px; color: #e11d48; margin-bottom: 20px; }
    .stat-row { font-size: 30px; font-weight: bold; margin: 14px 0; display: flex; justify-content: space-between; gap: 40px; }
    .stat-val { color: #0369a1; }
    .btn-restart {
      margin-top: 24px; background: #e11d48; color: #fff; font-size: 28px; font-weight: bold;
      border: none; border-radius: 35px; padding: 12px 50px; cursor: pointer;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="start-modal">
    <button class="btn-start-game" onclick="userStartPlay()">🚦 點我開始遊戲！</button>
  </div>

      <polygon points="80,183 140,175 145,190 85,198" fill="#ef4444" />
      <polygon points="95,181 110,179 115,194 100,196" fill="#ffffff" />
      <polygon points="125,177 140,175 145,190 130,192" fill="#ffffff" />
      <polygon points="40,155 75,150 75,120 40,125" fill="url(#glassGrad)" stroke="#cbd5e1" stroke-width="2"/>
      <polygon points="90,148 125,143 125,113 90,118" fill="url(#glassGrad)" stroke="#cbd5e1" stroke-width="2"/>

      <!-- 超商 -->
      <polygon points="230,215 370,192 370,55 230,78" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
      <polygon points="370,192 430,178 430,41 370,55" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
      <polygon points="228,78 372,55 372,70 228,93" fill="#16a34a" />
      <polygon points="228,93 372,70 372,78 228,101" fill="#ea580c" />
      <polygon points="372,55 432,41 432,56 372,70" fill="#15803d" />
      <polygon points="250,212 350,195 350,120 250,137" fill="url(#glassGrad)" stroke="#38bdf8" stroke-width="2.5"/>
      <line x1="300" y1="204" x2="300" y2="128" stroke="#0284c7" stroke-width="2" />
      <polygon points="385,170 415,162 415,135 385,143" fill="#94a3b8" />

      <!-- 紅磚樓 -->
      <polygon points="455,178 585,156 585,38 455,60" fill="#b91c1c" stroke="#991b1b" stroke-width="2"/>
      <polygon points="585,156 640,143 640,25 585,38" fill="#991b1b" stroke="#7f1d1d" stroke-width="2"/>
      <polygon points="450,60 580,38 635,25 505,47" fill="#475569" />
      <polygon points="475,175 510,169 510,135 475,141" fill="#451a03" />
      <polygon points="525,166 565,159 565,135 525,142" fill="url(#glassGrad)" stroke="#fff" stroke-width="2"/>
      <polygon points="475,128 510,122 510,95 475,101" fill="url(#glassGrad)" stroke="#fff" stroke-width="2"/>
      <polygon points="525,119 565,112 565,85 525,92" fill="url(#glassGrad)" stroke="#fff" stroke-width="2"/>
      <polygon points="600,130 625,124 625,100 600,106" fill="url(#glassGrad)" stroke="#fff" stroke-width="1.5"/>

      <!-- 洋房 -->
      <polygon points="665,142 795,120 795,20 665,42" fill="#e9d5ff" stroke="#c084fc" stroke-width="2"/>
      <polygon points="795,120 855,105 855,5 795,20" fill="#c084fc" stroke="#9333ea" stroke-width="2"/>
      <polygon points="660,42 730,0 800,20" fill="#f43f5e" />
      <polygon points="800,20 730,0 790,-10 860,5" fill="#e11d48" />
      <ellipse cx="730" cy="40" rx="14" ry="10" fill="url(#glassGrad)" stroke="#fff" stroke-width="2"/>
      <polygon points="685,138 725,131 725,85 685,92" fill="url(#glassGrad)" stroke="#fff" stroke-width="2"/>
      <polygon points="740,129 780,122 780,76 740,83" fill="url(#glassGrad)" stroke="#fff" stroke-width="2"/>

      <!-- 樹木與街燈 -->
      <ellipse cx="218" cy="235" rx="16" ry="7" fill="rgba(0,0,0,0.3)" />
      <rect x="215" y="195" width="6" height="40" fill="#78350f" />
      <ellipse cx="218" cy="180" rx="24" ry="30" fill="#16a34a" />
      <ellipse cx="214" cy="175" rx="18" ry="24" fill="#22c55e" />

      <ellipse cx="650" cy="165" rx="14" ry="6" fill="rgba(0,0,0,0.3)" />
      <rect x="647" y="130" width="5" height="35" fill="#78350f" />
      <ellipse cx="650" cy="120" rx="20" ry="25" fill="#15803d" />
      <ellipse cx="646" cy="116" rx="15" ry="20" fill="#4ade80" />

    <div id="grandpa-box">
      <div class="listen-badge">
        <span class="listen-ear">👂</span>
        <span class="listen-q">❓</span>
      </div>
      <div class="grandpa-shadow"></div>
      <svg class="grandpa-svg" viewBox="0 0 120 180">
        <path d="M 98 85 C 98 65, 114 65, 114 85 L 114 175" fill="none" stroke="#78350f" stroke-width="7" stroke-linecap="round"/>

        <rect x="60" y="112" width="16" height="58" rx="6" fill="#1e3a8a"/>
        <ellipse cx="42" cy="172" rx="13" ry="7" fill="#451a03"/>
        <ellipse cx="68" cy="172" rx="13" ry="7" fill="#451a03"/>
        <rect x="28" y="65" width="56" height="55" rx="12" fill="#92400e"/>
        <polygon points="46,65 56,82 66,65" fill="#fef08a"/>
        <ellipse cx="56" cy="45" rx="22" ry="24" fill="#fbcfe8"/>
        <circle cx="48" cy="42" r="7" fill="none" stroke="#1f2937" stroke-width="2.5"/>
        <circle cx="64" cy="42" r="7" fill="none" stroke="#1f2937" stroke-width="2.5"/>
        <line x1="55" y1="42" x2="57" y2="42" stroke="#1f2937" stroke-width="2.5"/>
        <path d="M 50 56 Q 56 62 62 56" fill="none" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>

        <ellipse cx="56" cy="28" rx="32" ry="8" fill="#78350f"/>
        <path d="M 34 28 C 34 10, 78 10, 78 28 Z" fill="#92400e"/>
        <rect x="35" y="23" width="42" height="5" fill="#ef4444"/>
      </svg>
    </div>

    <div id="vehicles-container"></div>
    <div id="guess-panel"></div>
  </div>

  <div id="result-modal">
    <div class="result-card">
      <h2>🎉 太厲害了！全部答對！</h2>
      <div class="stat-row">
        <span>總作答時間：</span>
        <span class="stat-val" id="res-time">0 秒</span>
      </div>
      <div class="stat-row">
        <span>答題正確率：</span>
        <span class="stat-val" id="res-accuracy">100%</span>
      </div>
      <div class="stat-row">
        <span>聽力靈敏度：</span>
        <span class="stat-val" style="color: #f59e0b;">⭐⭐⭐⭐⭐ 滿分</span>
      </div>
      <button class="btn-restart" onclick="restartGame()">再玩一次</button>
    </div>
  </div>
</div>

<script>
  const VEHICLE_DATA = {
    garbage: { name: '垃圾車', sound: '垃圾車聲.mp3', emoji: '🚛', volume: 0.35 },
    ambulance: { name: '救護車', sound: '救護車.mp3', emoji: '🚑', volume: 0.35 },
    firetruck: { name: '消防車', sound: '消防車.mp3', emoji: '🚒', volume: 0.35 },
    police: { name: '警車', sound: '警車.mp3', emoji: '🚓', volume: 0.35 },
    motorcycle: { name: '摩托車', sound: '摩托車.mp3', emoji: '🏍️', volume: 0.38 },
    horn: { name: '汽車喇叭', sound: '按喇叭.mp3', emoji: '🚗', volume: 0.35 }
  };

  const VOICE_CLIPS = {
    level1: { file: '聽聽看是什麼車子的聲音.mp3', text: '請仔細聽，這是哪一台車子的聲音呢？' },
    level2: { file: '後面車子的聲音.mp3', text: '後面有車子開過來囉，猜猜看是哪一台？' },
    level3: { file: '兩種車子的聲音.mp3', text: '仔細聽喔，這次有兩種車子的聲音！' },
    correct: { file: '答對了.mp3', text: '答對了！好厲害喔！' },
    tryAgain: { file: '再聽一次.mp3', text: '再聽一次看看喔～' }
  };

  const LEVELS = [
    {
      level: 1,
      title: "第一關：看車找聲音",
      voiceKey: 'level1',
      vehicles: ['garbage', 'motorcycle', 'ambulance'],
      target: 'garbage'
    },
    {
      level: 2,
      title: "第二關：聽後方來車",
      voiceKey: 'level2',
      options: ['firetruck', 'horn', 'police'],
      target: 'firetruck'
    },
    {
      level: 3,
      title: "第三關：雙重聲音大挑戰",
      voiceKey: 'level3',
      vehicles: ['motorcycle', 'firetruck', 'ambulance', 'police'],
      targets: ['motorcycle', 'police']
    }
  ];

  let currentLevelIdx = 0;
  let currentAudio = null;
  let audio2 = null;
  let voiceAudio = null;
  let promptTimer = null;
  let startTime = 0;
  let totalAttempts = 0;
  let correctAttempts = 0;
  let levelFoundTargets = [];

  function userStartPlay() {
    document.getElementById('start-modal').style.display = 'none';
    startTime = Date.now();
    loadLevel(0);
  }

  function setControlsLocked(isLocked) {
    const vContainer = document.getElementById('vehicles-container');
    const gPanel = document.getElementById('guess-panel');
    const replayBtn = document.getElementById('btn-sound');
    if (isLocked) {
      vContainer.classList.add('locked-controls');
      gPanel.classList.add('locked-controls');
      replayBtn.classList.add('locked-controls');
    } else {
      vContainer.classList.remove('locked-controls');
      gPanel.classList.remove('locked-controls');
      replayBtn.classList.remove('locked-controls');
    }
  }

  function playVoiceWithFallback(clipKey, onComplete) {
    if (voiceAudio) { voiceAudio.pause(); voiceAudio.currentTime = 0; }
    const clip = VOICE_CLIPS[clipKey];
    let hasFallbackRun = false;

    function runBrowserTTS() {
      if (hasFallbackRun) return;
      hasFallbackRun = true;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(clip.text);
        msg.lang = 'zh-TW';
        msg.volume = 1.0;
        msg.rate = 0.8;
        msg.pitch = 1.1;
        msg.onend = () => { if (onComplete) onComplete(); };
        window.speechSynthesis.speak(msg);
      } else {
        if (onComplete) onComplete();
      }
    }

    try {
      voiceAudio = new Audio(encodeURI(clip.file));
      voiceAudio.volume = 1.0;
      voiceAudio.onended = () => { if (onComplete) onComplete(); };
      const p = voiceAudio.play();
      if (p !== undefined) {
        p.catch(err => runBrowserTTS());
      }
    } catch (e) {
      runBrowserTTS();
    }
  }

  /* 車輛聲音完整播放 5.2 秒（原 3.2s + 延長 2s） */
  function playTurnSequence() {
    stopAllAudio();
    if (promptTimer) clearTimeout(promptTimer);

    setControlsLocked(true);

    const cur = LEVELS[currentLevelIdx];
    document.getElementById('instruction').innerText = "🔊 正在播放車輛聲音，請仔細聽...";

    if (cur.level === 3) {
      currentAudio = new Audio(encodeURI(VEHICLE_DATA[cur.targets[0]].sound));
      audio2 = new Audio(encodeURI(VEHICLE_DATA[cur.targets[1]].sound));
      currentAudio.volume = VEHICLE_DATA[cur.targets[0]].volume;
      audio2.volume = VEHICLE_DATA[cur.targets[1]].volume;
      currentAudio.play().catch(e => console.log(e));
      audio2.play().catch(e => console.log(e));
    } else {
      currentAudio = new Audio(encodeURI(VEHICLE_DATA[cur.target].sound));
      currentAudio.volume = VEHICLE_DATA[cur.target].volume;
      currentAudio.play().catch(e => console.log(e));
    }

    promptTimer = setTimeout(() => {
      stopAllAudio();
      document.getElementById('instruction').innerText = "請聽問題...";
      
      playVoiceWithFallback(cur.voiceKey, () => {
        document.getElementById('instruction').innerText = "請點選發出聲音的車輛！";
        setControlsLocked(false);
      });
    }, 5200);
  }

  function stopAllAudio() {
    if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
    if (audio2) { audio2.pause(); audio2.currentTime = 0; }
    if (voiceAudio) { voiceAudio.pause(); voiceAudio.currentTime = 0; }
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  }

  function cleanMovingVehicles() {
    const movingVehs = document.querySelectorAll('.dynamic-moving-veh');
    movingVehs.forEach(el => el.remove());
  }

  function loadLevel(idx) {
    currentLevelIdx = idx;
    const cur = LEVELS[idx];
    levelFoundTargets = [];

    document.getElementById('level-title').innerText = cur.title;
    document.getElementById('guess-panel').style.display = 'none';
    
    cleanMovingVehicles();
    const container = document.getElementById('vehicles-container');
    container.innerHTML = '';

    if (cur.level === 1 || cur.level === 3) {
      renderStationaryVehicles(cur.vehicles);
    } else if (cur.level === 2) {
      renderGuessOptions(cur.options);
    }

    playTurnSequence();
  }

  function renderStationaryVehicles(keys) {
    const container = document.getElementById('vehicles-container');
    container.innerHTML = '';
    keys.forEach(key => {
      const data = VEHICLE_DATA[key];
      const div = document.createElement('div');
      div.className = 'vehicle-item';
      div.id = `veh-${key}`;
      div.innerHTML = `
        <div class="vehicle-emoji">${data.emoji}</div>
        <span class="vehicle-name-tag">${data.name}</span>
      `;
      div.onclick = () => onVehicleClicked(key, div);
      container.appendChild(div);
    });
  }

  function onVehicleClicked(key, element) {
    totalAttempts++;
    const cur = LEVELS[currentLevelIdx];

    if (cur.level === 1) {
      if (key === cur.target) {
        correctAttempts++;
        element.classList.add('correct-glow');
        setControlsLocked(true);
        playVoiceWithFallback('correct', () => {
          setTimeout(nextLevel, 500);
        });
      } else {
        triggerGentleError(element);
      }
    } else if (cur.level === 3) {
      if (cur.targets.includes(key) && !levelFoundTargets.includes(key)) {
        correctAttempts++;
        levelFoundTargets.push(key);
        element.classList.add('correct-glow');
        if (levelFoundTargets.length === cur.targets.length) {
          setControlsLocked(true);
          playVoiceWithFallback('correct', () => {
            setTimeout(showFinalResult, 500);
          });
        } else {
          playVoiceWithFallback('correct');
        }
      } else {
        triggerGentleError(element);
      }
    }
  }

  function renderGuessOptions(keys) {
    const panel = document.getElementById('guess-panel');
    panel.innerHTML = '';
    panel.style.display = 'flex';
    keys.forEach(key => {
      const data = VEHICLE_DATA[key];
      const btn = document.createElement('div');
      btn.className = 'guess-btn';
      btn.innerHTML = `
        <div class="vehicle-emoji">${data.emoji}</div>
        <span>${data.name}</span>
      `;
      btn.onclick = () => onGuessClicked(key, btn);
      panel.appendChild(btn);
    });
  }

  function onGuessClicked(key, btnElem) {
    totalAttempts++;
    const cur = LEVELS[1];
    if (key === cur.target) {
      correctAttempts++;
      btnElem.classList.add('correct-glow');
      setControlsLocked(true);

      playVoiceWithFallback('correct', () => {
        document.getElementById('guess-panel').style.display = 'none';
        
        const v = document.createElement('div');
        v.className = 'vehicle-item dynamic-moving-veh';
        v.style.position = 'absolute';
        v.style.right = '-200px';
        v.style.bottom = '35%';
        v.style.zIndex = '35';
        v.style.transform = 'scale(0.4)';
        v.style.opacity = '0.7';
        v.innerHTML = `<div class="vehicle-emoji">${VEHICLE_DATA[key].emoji}</div><span class="vehicle-name-tag">${VEHICLE_DATA[key].name}</span>`;
        v.style.transition = 'all 1.6s cubic-bezier(0.25, 1, 0.5, 1)';
        document.getElementById('stage-area').appendChild(v);
        
        setTimeout(() => { 
          v.style.right = '40%'; 
          v.style.bottom = '12%';
          v.style.transform = 'scale(1.15)';
          v.style.opacity = '1';
        }, 50);
        setTimeout(nextLevel, 2200);
      });
    } else {
      triggerGentleError(btnElem);
    }
  }

  function triggerGentleError(element) {
    element.classList.add('shake-error');
    playVoiceWithFallback('tryAgain');
    setTimeout(() => {
      element.classList.remove('shake-error');
    }, 600);
  }

  function nextLevel() {
    stopAllAudio();
    cleanMovingVehicles();
    if (currentLevelIdx < LEVELS.length - 1) {
      loadLevel(currentLevelIdx + 1);
    } else {
      showFinalResult();
    }
  }

  function showFinalResult() {
    stopAllAudio();
    cleanMovingVehicles();
    const duration = Math.round((Date.now() - startTime) / 1000);
    const accuracy = totalAttempts > 0 ? Math.round((correctAttempts / totalAttempts) * 100) : 100;

    document.getElementById('res-time').innerText = `${duration} 秒`;
    document.getElementById('res-accuracy').innerText = `${accuracy}%`;
    document.getElementById('result-modal').style.display = 'flex';
  }

  function restartGame() {
    document.getElementById('result-modal').style.display = 'none';
    totalAttempts = 0;
    correctAttempts = 0;
    startTime = Date.now();
    loadLevel(0);
  }
</script>
</body>
</html>
