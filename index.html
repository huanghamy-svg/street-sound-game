<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>街道聽音尋車記</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b1329;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #87ceeb;
      overflow: hidden;
    }

    /* 頂部操作與提示列 */
    #header-bar {
      height: 60px;
      min-height: 60px;
      background: #ffffff;
      border-bottom: 3px solid #f59e0b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
    }
    .level-badge {
      font-size: 17px;
      font-weight: 900;
      color: #7c2d12;
      background: #fed7aa;
      padding: 5px 12px;
      border-radius: 20px;
      border: 2px solid #ea580c;
      white-space: nowrap;
    }
    .instruction-text {
      font-size: 18px;
      font-weight: 900;
      color: #b91c1c;
      text-align: center;
      flex: 1;
      margin: 0 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-replay-sound {
      background: #10b981;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      border: 2px solid #047857;
      border-radius: 30px;
      padding: 6px 14px;
      cursor: pointer;
      box-shadow: 0 3px 0 #047857;
      white-space: nowrap;
    }
    .btn-replay-sound:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    /* 上半部：精緻街道與阿公 */
    #stage-area {
      height: 48%;
      position: relative;
      overflow: hidden;
      background: linear-gradient(to bottom, #60a5fa 0%, #93c5fd 40%, #dbeafe 55%);
      border-bottom: 4px solid #1e293b;
    }

    .iso-street-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    #grandpa-box {
      position: absolute;
      bottom: 8%;
      left: 6%;
      width: 80px;
      height: 135px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      pointer-events: none;
    }
    .grandpa-shadow {
      position: absolute;
      bottom: -4px;
      width: 60px;
      height: 14px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 50%;
      filter: blur(3px);
      z-index: -1;
    }
    .listen-badge {
      display: flex;
      align-items: center;
      gap: 2px;
      animation: pulse 0.9s infinite alternate;
      margin-bottom: -10px;
      z-index: 30;
    }
    .listen-ear {
      font-size: 28px;
    }
    .listen-q {
      font-size: 30px;
      font-weight: 900;
      color: #ef4444;
      animation: bounce 0.8s infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(0.9); }
      100% { transform: scale(1.15); }
    }
    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-5px); }
    }
    .grandpa-svg {
      width: 100%;
      height: 90%;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
    }

    /* 下半部：大按鈕操作區 */
    #bottom-controls {
      height: 52%;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      position: relative;
    }

    #vehicles-container {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(95px, 1fr));
      gap: 12px;
      align-items: center;
    }

    .vehicle-item {
      height: 90%;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      background: linear-gradient(145deg, #ffffff, #f1f5f9);
      border: 3px solid #38bdf8;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3), 0 4px 0 #0284c7;
      transition: all 0.2s ease;
      touch-action: manipulation;
      padding: 8px;
    }
    .vehicle-emoji {
      font-size: clamp(40px, 11vw, 56px);
      line-height: 1.1;
    }
    .vehicle-name-tag {
      background: #0f172a;
      color: #fff;
      font-size: clamp(16px, 4.2vw, 22px);
      font-weight: 900;
      padding: 4px 14px;
      border-radius: 10px;
      margin-top: 6px;
      white-space: nowrap;
    }

    .locked-controls {
      pointer-events: none !important;
      opacity: 0.45 !important;
      filter: grayscale(40%);
    }

    .vehicle-item:not(.locked-controls):active {
      transform: translateY(3px) scale(0.96);
    }

    /* 第二關選項 */
    #guess-panel {
      position: absolute;
      top: 14px;
      bottom: 14px;
      left: 14px;
      right: 14px;
      background: rgba(255, 255, 255, 0.98);
      border-radius: 20px;
      border: 4px solid #0284c7;
      display: none;
      align-items: center;
      justify-content: space-around;
      padding: 10px;
      z-index: 40;
    }
    .guess-btn {
      flex: 1;
      height: 90%;
      margin: 0 6px;
      background: #f0fdf4;
      border: 3px solid #22c55e;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 5px 0 #15803d;
      touch-action: manipulation;
    }
    .guess-btn:not(.locked-controls):active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #15803d;
    }
    .guess-btn .vehicle-emoji {
      font-size: clamp(40px, 10vw, 56px);
    }
    .guess-btn span {
      font-size: clamp(16px, 4vw, 22px);
      font-weight: 900;
      color: #14532d;
      margin-top: 6px;
      white-space: nowrap;
    }

    .shake-error {
      animation: shake 0.4s ease-in-out;
      border-color: #ea580c !important;
      background: #ffedd5 !important;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
    .correct-glow {
      box-shadow: 0 0 30px #10b981 !important;
      border-color: #10b981 !important;
      transform: scale(1.05) !important;
    }

    /* 開始遮罩 */
    #start-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }
    .btn-start-game {
      background: #f59e0b;
      color: #7c2d12;
      font-size: 32px;
      font-weight: 900;
      border: 4px solid #fff;
      border-radius: 40px;
      padding: 16px 40px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      touch-action: manipulation;
    }

    #result-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.95);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 300;
      color: #fff;
      padding: 20px;
    }
    .result-card {
      background: #fff;
      color: #1e293b;
      padding: 24px 28px;
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 16px 36px rgba(0,0,0,0.6);
      border: 5px solid #fbbf24;
      width: 90%;
      max-width: 360px;
    }
    .result-card h2 {
      font-size: 26px;
      color: #e11d48;
      margin-bottom: 12px;
    }
    .stat-row {
      font-size: 19px;
      font-weight: bold;
      margin: 8px 0;
      display: flex;
      justify-content: space-between;
    }
    .stat-val {
      color: #0369a1;
    }
    .btn-restart {
      margin-top: 16px;
      background: #e11d48;
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 28px;
      padding: 10px 36px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="start-modal">
    <button class="btn-start-game" id="btn-start-trigger">🚦 點我開始遊戲！</button>
  </div>

  <div id="header-bar">
    <div class="level-badge" id="level-title">第一關</div>
    <div class="instruction-text" id="instruction">🔊 正在播放車輛聲音...</div>
    <button class="btn-replay-sound" id="btn-sound" onclick="playTurnSequence()">🔊 再聽一次</button>

  <div id="stage-area">

      <polygon points="150,230 205,218 205,73 150,85" fill="#fb923c" stroke="#c2410c" stroke-width="2"/>

      <!-- 超商 -->
      <polygon points="230,215 370,192 370,55 230,78" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
      <polygon points="370,192 430,178 430,41 370,55" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
      <polygon points="228,78 372,55 372,70 228,93" fill="#16a34a" />
      <polygon points="228,93 372,70 372,78 228,101" fill="#ea580c" />
      <polygon points="372,55 432,41 432,56 372,70" fill="#15803d" />
      <polygon points="250,212 350,195 350,120 250,137" fill="url(#glassGrad)" stroke="#38bdf8" stroke-width="2.5"/>

      <!-- 紅磚樓 -->
      <polygon points="455,178 585,156 585,38 455,60" fill="#b91c1c" stroke="#991b1b" stroke-width="2"/>
      <polygon points="585,156 640,143 640,25 585,38" fill="#991b1b" stroke="#7f1d1d" stroke-width="2"/>
      <polygon points="450,60 580,38 635,25 505,47" fill="#475569" />
      <polygon points="475,175 510,169 510,135 475,141" fill="#451a03" />
      <polygon points="525,166 565,159 565,135 525,142" fill="url(#glassGrad)" stroke="#fff" stroke-width="2"/>

      <!-- 洋房 -->
      <polygon points="665,142 795,120 795,20 665,42" fill="#e9d5ff" stroke="#c084fc" stroke-width="2"/>
      <polygon points="795,120 855,105 855,5 795,20" fill="#c084fc" stroke="#9333ea" stroke-width="2"/>
      <polygon points="660,42 730,0 800,20" fill="#f43f5e" />

      <!-- 樹木與街燈 -->
      <ellipse cx="218" cy="235" rx="16" ry="7" fill="rgba(0,0,0,0.3)" />
      <rect x="215" y="195" width="6" height="40" fill="#78350f" />
      <ellipse cx="218" cy="180" rx="24" ry="30" fill="#16a34a" />

      <ellipse cx="650" cy="165" rx="14" ry="6" fill="rgba(0,0,0,0.3)" />
      <rect x="647" y="130" width="5" height="35" fill="#78350f" />
      <ellipse cx="650" cy="120" rx="20" ry="25" fill="#15803d" />

      <line x1="440" y1="188" x2="440" y2="120" stroke="#475569" stroke-width="4" />
      <circle cx="440" cy="122" r="5" fill="#fef08a" />
    </svg>

    <div id="grandpa-box">
      <div class="listen-badge">
        <span class="listen-ear">👂</span>
        <span class="listen-q">❓</span>
      </div>
      <div class="grandpa-shadow"></div>
      <svg class="grandpa-svg" viewBox="0 0 120 180">
        <path d="M 98 85 C 98 65, 114 65, 114 85 L 114 175" fill="none" stroke="#78350f" stroke-width="7" stroke-linecap="round"/>

        <ellipse cx="42" cy="172" rx="13" ry="7" fill="#451a03"/>
        <ellipse cx="68" cy="172" rx="13" ry="7" fill="#451a03"/>

        <polygon points="46,65 56,82 66,65" fill="#fef08a"/>
        <ellipse cx="56" cy="45" rx="22" ry="24" fill="#fbcfe8"/>
        <circle cx="48" cy="42" r="7" fill="none" stroke="#1f2937" stroke-width="2.5"/>
        <circle cx="64" cy="42" r="7" fill="none" stroke="#1f2937" stroke-width="2.5"/>
        <line x1="55" y1="42" x2="57" y2="42" stroke="#1f2937" stroke-width="2.5"/>
        <path d="M 50 56 Q 56 62 62 56" fill="none" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>
        <path d="M 40 48 Q 56 70 72 48 Q 64 74 56 74 Q 48 74 40 48 Z" fill="#ffffff"/>
        <ellipse cx="56" cy="28" rx="32" ry="8" fill="#78350f"/>
        <path d="M 34 28 C 34 10, 78 10, 78 28 Z" fill="#92400e"/>
        <rect x="35" y="23" width="42" height="5" fill="#ef4444"/>
      </svg>
    </div>
  </div>

  <div id="bottom-controls">
    <div id="vehicles-container"></div>
    <div id="guess-panel"></div>
  </div>

  <div id="result-modal">
    <div class="result-card">
      <h2>🎉 太厲害了！全部答對！</h2>
      <div class="stat-row">
        <span>總作答時間：</span>
        <span class="stat-val" id="res-time">0 秒</span>
      </div>
      <div class="stat-row">
        <span>答題正確率：</span>
        <span class="stat-val" id="res-accuracy">100%</span>
      </div>
      <div class="stat-row">
        <span>聽力靈敏度：</span>
        <span class="stat-val" style="color: #f59e0b;">⭐⭐⭐⭐⭐ 滿分</span>
      </div>
      <button class="btn-restart" onclick="restartGame()">再玩一次</button>
    </div>
  </div>
</div>

<script>
  const VEHICLE_DATA = {
    garbage: { name: '垃圾車', sound: '垃圾車聲.mp3', emoji: '🚛', volume: 0.8 },
    ambulance: { name: '救護車', sound: '救護車.mp3', emoji: '🚑', volume: 0.8 },
    firetruck: { name: '消防車', sound: '消防車.mp3', emoji: '🚒', volume: 0.8 },
    police: { name: '警車', sound: '警車.mp3', emoji: '🚓', volume: 0.8 },
    motorcycle: { name: '摩托車', sound: '摩托車.mp3', emoji: '🏍️', volume: 0.8 },
    horn: { name: '汽車喇叭', sound: '按喇叭.mp3', emoji: '🚗', volume: 0.8 }
  };

  const VOICE_CLIPS = {
    level1: { file: '聽聽看是什麼車子的聲音.mp3', text: '請仔細聽，這是哪一台車子的聲音呢？' },
    level2: { file: '後面車子的聲音.mp3', text: '後面有車子開過來囉，猜猜看是哪一台？' },
    level3: { file: '兩種車子的聲音.mp3', text: '仔細聽喔，這次有兩種車子的聲音！' },
    correct: { file: '答對了.mp3', text: '答對了！好厲害喔！' },
    tryAgain: { file: '再聽一次.mp3', text: '再聽一次看看喔～' }
  };

  const LEVELS = [
    {
      level: 1,
      title: "第一關：看車找聲音",
      voiceKey: 'level1',
      vehicles: ['garbage', 'motorcycle', 'ambulance'],
      target: 'garbage'
    },
    {
      level: 2,
      title: "第二關：聽後方來車",
      voiceKey: 'level2',
      options: ['firetruck', 'horn', 'police'],
      target: 'firetruck'
    },
    {
      level: 3,
      title: "第三關：雙重聲音大挑戰",
      voiceKey: 'level3',
      vehicles: ['motorcycle', 'firetruck', 'ambulance', 'police'],
      targets: ['motorcycle', 'police']
    }
  ];

  let currentLevelIdx = 0;
  let currentAudio = null;
  let audio2 = null;
  let voiceAudio = null;
  let promptTimer = null;
  let startTime = 0;
  let totalAttempts = 0;
  let correctAttempts = 0;
  let levelFoundTargets = [];

  // 手機全域共用解鎖 Audio 實例，防止手機靜音限制
  const audioContextUnlocked = new Audio();

  document.getElementById('btn-start-trigger').addEventListener('click', function() {
    // 點擊觸發手機瀏覽器解鎖音訊權限
    audioContextUnlocked.play().catch(e => {});
    if ('speechSynthesis' in window) {
      const emptyUtter = new SpeechSynthesisUtterance('');
      window.speechSynthesis.speak(emptyUtter);
    }

    const modal = document.getElementById('start-modal');
    if (modal) modal.remove();
    startTime = Date.now();
    loadLevel(0);
  });

  function setControlsLocked(isLocked) {
    const vContainer = document.getElementById('vehicles-container');
    const gPanel = document.getElementById('guess-panel');
    const replayBtn = document.getElementById('btn-sound');
    if (!vContainer) return;

    if (isLocked) {
      vContainer.classList.add('locked-controls');
      gPanel.classList.add('locked-controls');
      replayBtn.classList.add('locked-controls');
    } else {
      vContainer.classList.remove('locked-controls');
      gPanel.classList.remove('locked-controls');
      replayBtn.classList.remove('locked-controls');
    }
  }

  /* 提問語音保證發聲 */
  function playVoiceWithFallback(clipKey, onComplete) {
    if (voiceAudio) { voiceAudio.pause(); voiceAudio.currentTime = 0; }
    const clip = VOICE_CLIPS[clipKey];
    let hasCompleted = false;

    const finish = () => {
      if (!hasCompleted) {
        hasCompleted = true;
        if (onComplete) onComplete();
      }
    };

    function runBrowserTTS() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(clip.text);
        msg.lang = 'zh-TW';
        msg.volume = 1.0;
        msg.rate = 0.85;
        msg.onend = finish;
        msg.onerror = finish;
        window.speechSynthesis.speak(msg);
      } else {
        finish();
      }
    }

    try {
      voiceAudio = new Audio(encodeURI(clip.file));
      voiceAudio.volume = 1.0;
      voiceAudio.onended = finish;
      voiceAudio.onerror = runBrowserTTS;

      const p = voiceAudio.play();
      if (p !== undefined) {
        p.catch(runBrowserTTS);
      }
    } catch (e) {
      runBrowserTTS();
    }

    // 防卡死時間保證：4.5秒後無論如何開放下一步
    setTimeout(finish, 4500);
  }

  /* 車輛聲音完整播放 5.2 秒 */
  function playTurnSequence() {
    stopAllAudio();
    if (promptTimer) clearTimeout(promptTimer);

    setControlsLocked(true);

    const cur = LEVELS[currentLevelIdx];
    document.getElementById('instruction').innerText = "🔊 正在播放車輛聲音...";

    try {
      if (cur.level === 3) {
        // 第三關：順暢依序預備並播放兩種聲音
        currentAudio = new Audio(encodeURI(VEHICLE_DATA[cur.targets[0]].sound));
        currentAudio.volume = VEHICLE_DATA[cur.targets[0]].volume;
        currentAudio.play().catch(e => console.log(e));

        setTimeout(() => {
          audio2 = new Audio(encodeURI(VEHICLE_DATA[cur.targets[1]].sound));
          audio2.volume = VEHICLE_DATA[cur.targets[1]].volume;
          audio2.play().catch(e => console.log(e));
        }, 300);
      } else {
        currentAudio = new Audio(encodeURI(VEHICLE_DATA[cur.target].sound));
        currentAudio.volume = VEHICLE_DATA[cur.target].volume;
        currentAudio.play().catch(e => console.log(e));
      }
    } catch (e) {
      console.log(e);
    }

    promptTimer = setTimeout(() => {
      stopAllAudio();
      document.getElementById('instruction').innerText = "請聽問題...";
      
      playVoiceWithFallback(cur.voiceKey, () => {
        document.getElementById('instruction').innerText = "請點選發出聲音的車輛！";
        setControlsLocked(false);
      });
    }, 5200);
  }

  function stopAllAudio() {
    if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
    if (audio2) { audio2.pause(); audio2.currentTime = 0; }
    if (voiceAudio) { voiceAudio.pause(); voiceAudio.currentTime = 0; }
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  }

  /* 關鍵修正：徹底刪除所有動態開過來的小車，絕不殘留在第三關 */
  function cleanMovingVehicles() {
    const movingVehs = document.querySelectorAll('.dynamic-moving-veh');
    movingVehs.forEach(el => el.remove());
  }

  function loadLevel(idx) {
    currentLevelIdx = idx;
    const cur = LEVELS[idx];
    levelFoundTargets = [];

    document.getElementById('level-title').innerText = cur.title;
    document.getElementById('guess-panel').style.display = 'none';
    
    // 強制清除任何第二關開出的消防車/車輛殘影
    cleanMovingVehicles();

    const container = document.getElementById('vehicles-container');
    container.innerHTML = '';

    if (cur.level === 1 || cur.level === 3) {
      renderStationaryVehicles(cur.vehicles);
    } else if (cur.level === 2) {
      renderGuessOptions(cur.options);
    }

    playTurnSequence();
  }

  function renderStationaryVehicles(keys) {
    const container = document.getElementById('vehicles-container');
    container.innerHTML = '';
    keys.forEach(key => {
      const data = VEHICLE_DATA[key];
      const div = document.createElement('div');
      div.className = 'vehicle-item';
      div.id = `veh-${key}`;
      div.innerHTML = `
        <div class="vehicle-emoji">${data.emoji}</div>
        <span class="vehicle-name-tag">${data.name}</span>
      `;
      div.onclick = () => onVehicleClicked(key, div);
      container.appendChild(div);
    });
  }

  function onVehicleClicked(key, element) {
    totalAttempts++;
    const cur = LEVELS[currentLevelIdx];

    if (cur.level === 1) {
      if (key === cur.target) {
        correctAttempts++;
        element.classList.add('correct-glow');
        setControlsLocked(true);
        playVoiceWithFallback('correct', () => {
          setTimeout(nextLevel, 500);
        });
      } else {
        triggerGentleError(element);
      }
    } else if (cur.level === 3) {
      if (cur.targets.includes(key) && !levelFoundTargets.includes(key)) {
        correctAttempts++;
        levelFoundTargets.push(key);
        element.classList.add('correct-glow');
        if (levelFoundTargets.length === cur.targets.length) {
          setControlsLocked(true);
          playVoiceWithFallback('correct', () => {
            setTimeout(showFinalResult, 500);
          });
        } else {
          playVoiceWithFallback('correct');
        }
      } else {
        triggerGentleError(element);
      }
    }
  }

  function renderGuessOptions(keys) {
    const panel = document.getElementById('guess-panel');
    panel.innerHTML = '';
    panel.style.display = 'flex';
    keys.forEach(key => {
      const data = VEHICLE_DATA[key];
      const btn = document.createElement('div');
      btn.className = 'guess-btn';
      btn.innerHTML = `
        <div class="vehicle-emoji">${data.emoji}</div>
        <span>${data.name}</span>
      `;
      btn.onclick = () => onGuessClicked(key, btn);
      panel.appendChild(btn);
    });
  }

  function onGuessClicked(key, btnElem) {
    totalAttempts++;
    const cur = LEVELS[1];
    if (key === cur.target) {
      correctAttempts++;
      btnElem.classList.add('correct-glow');
      setControlsLocked(true);

      playVoiceWithFallback('correct', () => {
        document.getElementById('guess-panel').style.display = 'none';
        
        // 建立動畫車輛
        const v = document.createElement('div');
        v.className = 'vehicle-item dynamic-moving-veh';
        v.style.position = 'absolute';
        v.style.right = '-160px';
        v.style.bottom = '22%';
        v.style.zIndex = '35';
        v.style.transform = 'scale(0.5)';
        v.style.opacity = '0.7';
        v.innerHTML = `<div class="vehicle-emoji">${VEHICLE_DATA[key].emoji}</div><span class="vehicle-name-tag">${VEHICLE_DATA[key].name}</span>`;
        v.style.transition = 'all 1.6s cubic-bezier(0.25, 1, 0.5, 1)';
        document.getElementById('stage-area').appendChild(v);
        
        setTimeout(() => { 
          v.style.right = '32%'; 
          v.style.bottom = '10%';
          v.style.transform = 'scale(1.1)';
          v.style.opacity = '1';
        }, 50);

        setTimeout(() => {
          cleanMovingVehicles(); // 開完後抵達目的地立即清除
          nextLevel();
        }, 2200);
      });
    } else {
      triggerGentleError(btnElem);
    }
  }

  function triggerGentleError(element) {
    element.classList.add('shake-error');
    playVoiceWithFallback('tryAgain');
    setTimeout(() => {
      element.classList.remove('shake-error');
    }, 600);
  }

  function nextLevel() {
    stopAllAudio();
    cleanMovingVehicles();
    if (currentLevelIdx < LEVELS.length - 1) {
      loadLevel(currentLevelIdx + 1);
    } else {
      showFinalResult();
    }
  }

  function showFinalResult() {
    stopAllAudio();
    cleanMovingVehicles();
    const duration = Math.round((Date.now() - startTime) / 1000);
    const accuracy = totalAttempts > 0 ? Math.round((correctAttempts / totalAttempts) * 100) : 100;

    document.getElementById('res-time').innerText = `${duration} 秒`;
    document.getElementById('res-accuracy').innerText = `${accuracy}%`;
    document.getElementById('result-modal').style.display = 'flex';
  }

  function restartGame() {
    document.getElementById('result-modal').style.display = 'none';
    totalAttempts = 0;
    correctAttempts = 0;
    startTime = Date.now();
    loadLevel(0);
  }
</script>
</body>
</html>
